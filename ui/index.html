<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronista</title>
<style>
  /* Near-black neutrals with a cool tint, hairline borders, one accent, small fast motion. System
     fonts only: the app works offline. Every look is a set of these variables: "system" (no
     data-theme) is dark or light as Windows is; the others are picked in the Theme menu. The
     recording red and the danger red stay the same in all of them, since they mean something. */
  :root {
    color-scheme: dark;
    --bg: #0b0c0f; --surface: #111216; --surface-2: #17181d; --surface-3: #1e1f25;
    --border: rgba(255, 255, 255, 0.07); --border-strong: rgba(255, 255, 255, 0.13);
    --text: #ececef; --text-2: #a3a4ad; --text-3: #6e6f79;
    --accent: #ff5a4e; --accent-soft: rgba(255, 90, 78, 0.12); --accent-text: #ff8a7f;
    --rec: #ff5a4e; --rec-soft: rgba(255, 90, 78, 0.12); --rec-text: #ff8a7f;
    --danger: #ff7b72; --danger-soft: rgba(255, 90, 78, 0.12);
    --ok: #3ddc97; --warn: #f5b74f;
    --mic: #ff8a7f; --mic-bg: rgba(255, 90, 78, 0.13); --computer: #8ab4ff; --computer-bg: rgba(110, 160, 255, 0.14);
    --mark: rgba(255, 200, 87, 0.28);
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 10px 30px rgba(0, 0, 0, 0.35);
    --radius: 10px; --radius-lg: 14px;
    --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --bg: #f6f6f7; --surface: #ffffff; --surface-2: #f1f1f3; --surface-3: #e9e9ec;
      --border: rgba(12, 13, 18, 0.08); --border-strong: rgba(12, 13, 18, 0.14);
      --text: #111216; --text-2: #575864; --text-3: #8b8c96;
      --accent: #f23b4c; --accent-soft: rgba(242, 59, 76, 0.09); --accent-text: #d8323f;
      --rec-soft: rgba(242, 59, 76, 0.09); --rec-text: #d8323f; --danger: #c42b36; --danger-soft: rgba(242, 59, 76, 0.09);
      --mic: #d8323f; --mic-bg: rgba(242, 59, 76, 0.09); --computer: #2f63c9; --computer-bg: rgba(47, 99, 201, 0.09);
      --mark: rgba(255, 196, 0, 0.32);
      --shadow: 0 1px 2px rgba(12, 13, 18, 0.04), 0 8px 24px rgba(12, 13, 18, 0.06);
    }
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f7; --surface: #ffffff; --surface-2: #f1f1f3; --surface-3: #e9e9ec;
    --border: rgba(12, 13, 18, 0.08); --border-strong: rgba(12, 13, 18, 0.14);
    --text: #111216; --text-2: #575864; --text-3: #8b8c96;
    --accent: #f23b4c; --accent-soft: rgba(242, 59, 76, 0.09); --accent-text: #d8323f;
    --rec-soft: rgba(242, 59, 76, 0.09); --rec-text: #d8323f; --danger: #c42b36; --danger-soft: rgba(242, 59, 76, 0.09);
    --mic: #d8323f; --mic-bg: rgba(242, 59, 76, 0.09); --computer: #2f63c9; --computer-bg: rgba(47, 99, 201, 0.09);
    --mark: rgba(255, 196, 0, 0.32);
    --shadow: 0 1px 2px rgba(12, 13, 18, 0.04), 0 8px 24px rgba(12, 13, 18, 0.06);
  }
  :root[data-theme="midnight"] {
    --bg: #070b17; --surface: #0c1222; --surface-2: #121a2e; --surface-3: #19223a;
    --border: rgba(140, 170, 255, 0.10); --border-strong: rgba(140, 170, 255, 0.19);
    --text: #e6ecff; --text-2: #9aa6c4; --text-3: #66718f;
    --accent: #5b8cff; --accent-soft: rgba(91, 140, 255, 0.15); --accent-text: #8fb0ff;
    --mic: #ff9a9a; --mic-bg: rgba(255, 110, 110, 0.14); --computer: #7cc4ff; --computer-bg: rgba(90, 170, 255, 0.16);
  }
  :root[data-theme="ocean"] {
    --bg: #051316; --surface: #0a1c20; --surface-2: #0f262b; --surface-3: #163238;
    --border: rgba(120, 230, 220, 0.09); --border-strong: rgba(120, 230, 220, 0.18);
    --text: #e3f6f4; --text-2: #95b9b6; --text-3: #5f8582;
    --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, 0.14); --accent-text: #6ee7d8;
    --mic: #ffa98a; --mic-bg: rgba(255, 140, 100, 0.14); --computer: #7dd3fc; --computer-bg: rgba(125, 211, 252, 0.14);
  }
  :root[data-theme="forest"] {
    --bg: #0a120d; --surface: #0f1a13; --surface-2: #15231a; --surface-3: #1c2d22;
    --border: rgba(160, 230, 180, 0.08); --border-strong: rgba(160, 230, 180, 0.17);
    --text: #e6f2e9; --text-2: #9bb8a3; --text-3: #64806c;
    --accent: #4ade80; --accent-soft: rgba(74, 222, 128, 0.13); --accent-text: #86efac;
    --mic: #fca5a5; --mic-bg: rgba(248, 113, 113, 0.14); --computer: #93c5fd; --computer-bg: rgba(147, 197, 253, 0.14);
  }
  :root[data-theme="grape"] {
    --bg: #110c1a; --surface: #171024; --surface-2: #1f1630; --surface-3: #281d3d;
    --border: rgba(210, 170, 255, 0.09); --border-strong: rgba(210, 170, 255, 0.18);
    --text: #f1e9ff; --text-2: #b3a3cc; --text-3: #7a6b93;
    --accent: #e879f9; --accent-soft: rgba(232, 121, 249, 0.14); --accent-text: #f0abfc;
    --mic: #fda4af; --mic-bg: rgba(251, 113, 133, 0.15); --computer: #a5b4fc; --computer-bg: rgba(165, 180, 252, 0.15);
  }
  :root[data-theme="sunset"] {
    --bg: #140d0a; --surface: #1c130f; --surface-2: #241914; --surface-3: #2e201a;
    --border: rgba(255, 190, 150, 0.09); --border-strong: rgba(255, 190, 150, 0.18);
    --text: #fbeee6; --text-2: #c4a898; --text-3: #8a7064;
    --accent: #ff9a52; --accent-soft: rgba(255, 154, 82, 0.14); --accent-text: #ffbd8a;
    --mic: #ff9a9a; --mic-bg: rgba(255, 110, 110, 0.15); --computer: #93c5fd; --computer-bg: rgba(147, 197, 253, 0.14);
  }
  :root[data-theme="paper"] {
    color-scheme: light;
    --bg: #f4eee3; --surface: #fbf8f1; --surface-2: #efe7d8; --surface-3: #e6dcc9;
    --border: rgba(60, 40, 20, 0.10); --border-strong: rgba(60, 40, 20, 0.19);
    --text: #2b2118; --text-2: #6b5a48; --text-3: #9a8a77;
    --accent: #c2410c; --accent-soft: rgba(194, 65, 12, 0.10); --accent-text: #b3360a;
    --rec-soft: rgba(242, 59, 76, 0.10); --rec-text: #c42b36; --danger: #b42318; --danger-soft: rgba(194, 40, 30, 0.09);
    --mic: #b3360a; --mic-bg: rgba(194, 65, 12, 0.10); --computer: #1d5fa8; --computer-bg: rgba(29, 95, 168, 0.10);
    --mark: rgba(255, 196, 0, 0.35);
    --shadow: 0 1px 2px rgba(60, 40, 20, 0.05), 0 8px 24px rgba(60, 40, 20, 0.07);
  }
  :root[data-theme="contrast"] {
    --bg: #000000; --surface: #000000; --surface-2: #0d0d0d; --surface-3: #1c1c1c;
    --border: rgba(255, 255, 255, 0.42); --border-strong: #ffffff;
    --text: #ffffff; --text-2: #f2f2f2; --text-3: #cfcfcf;
    --accent: #ffd60a; --accent-soft: rgba(255, 214, 10, 0.18); --accent-text: #ffe45c;
    --mic: #ffd60a; --mic-bg: rgba(255, 214, 10, 0.16); --computer: #7cf0ff; --computer-bg: rgba(124, 240, 255, 0.16);
    --mark: rgba(255, 214, 10, 0.45);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 7px; transition: background .12s, border-color .12s, color .12s, opacity .12s; }
  button:hover:not(:disabled) { background: var(--surface-3); border-color: var(--border-strong); }
  button:disabled { cursor: default; opacity: .5; }
  button:focus-visible, input:focus-visible, select:focus-visible, .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  button.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--text); opacity: .9; }
  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: transparent; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  input, select { border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; outline: none; transition: border-color .12s, background .12s; }
  input:hover, select:hover { border-color: var(--border-strong); }
  select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  [hidden] { display: none !important; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid transparent; border-radius: 999px; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: var(--text-3); }
  ::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none; }

  .app { display: grid; grid-template-rows: 54px 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 22px; height: 22px; }
  .brand b { font: 600 15px/1 var(--font-display); letter-spacing: -0.01em; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 4px 10px 4px 9px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
  .pill.ready i { background: var(--ok); }
  .pill.busy i { background: var(--warn); animation: blink 1.2s ease-in-out infinite; }
  .pill.live { color: var(--rec-text); background: var(--rec-soft); border-color: transparent; }
  .pill.live i { background: var(--rec); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .spacer { flex: 1; }
  .segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); }
  .segmented button { border: 0; background: transparent; padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--text-3); border-radius: 6px; }
  .segmented button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }

  .body { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
  aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .search { position: relative; padding: 14px 14px 10px; }
  .search .icon { position: absolute; left: 25px; top: 50%; transform: translateY(-38%); color: var(--text-3); }
  .search input { width: 100%; padding-left: 34px; background: var(--surface); }
  .list-head { display: flex; justify-content: space-between; padding: 4px 18px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .list { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: 0 8px 14px; display: flex; flex-direction: column; gap: 2px; }
  .item { position: relative; display: block; text-align: left; width: 100%; background: transparent; border-color: transparent; padding: 9px 12px 10px; border-radius: 9px; }
  .item:hover:not(:disabled) { background: var(--surface); border-color: transparent; }
  .item.selected { background: var(--surface-2); border-color: var(--border); }
  .item.selected::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--accent); }
  .item .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { color: var(--text-3); font-size: 12px; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .item .snippet { color: var(--text-2); font-size: 12.5px; margin-top: 4px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .list .none { color: var(--text-3); padding: 8px 12px; font-size: 13px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }

  main { overflow-y: auto; scrollbar-gutter: stable; }  /* no shift when a scrollbar comes or goes */
  .column { max-width: 880px; margin: 0 auto; padding: 22px 26px 40px; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
  .banner { border: 1px solid var(--danger-soft); background: var(--danger-soft); color: var(--danger); border-radius: var(--radius); padding: 10px 14px; }

  .recorder { padding: 18px 20px 22px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .field { position: relative; display: inline-flex; align-items: center; }
  .field .icon { position: absolute; left: 10px; color: var(--text-3); pointer-events: none; }
  .field select { padding-left: 32px; }
  #mic { max-width: 300px; }
  .switch { display: inline-flex; align-items: center; gap: 9px; padding: 6px 12px 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; user-select: none; color: var(--text-2); }
  .switch:hover { border-color: var(--border-strong); }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 28px; height: 16px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--border-strong); position: relative; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-2); transition: transform .15s, background .15s; }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(12px); background: #fff; }
  .switch input:checked ~ span { color: var(--text); }
  .switch:has(input:disabled) { opacity: .5; cursor: default; }

  .stage { display: flex; align-items: center; gap: 22px; margin-top: 20px; }
  .record { position: relative; width: 76px; height: 76px; border-radius: 50%; padding: 0; justify-content: center; background: var(--surface-2); border: 1px solid var(--border-strong); flex: none; }
  .record::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px solid var(--border); transition: border-color .2s, inset .2s; }
  .record .dot { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(180deg, #ff6a55, #f23b4c); box-shadow: 0 6px 18px rgba(242, 59, 76, .35); transition: border-radius .2s, width .2s, height .2s; }
  .record:hover:not(:disabled) .dot { box-shadow: 0 6px 24px rgba(242, 59, 76, .55); }
  .record.active { background: var(--rec-soft); border-color: rgba(255, 90, 78, .45); }
  .record.active::before { border-color: rgba(255, 90, 78, .35); animation: halo 1.6s ease-out infinite; }
  .record.active .dot { width: 24px; height: 24px; border-radius: 6px; }
  @keyframes halo { 0% { inset: -4px; opacity: 1; } 100% { inset: -14px; opacity: 0; } }
  .timer { font: 600 40px/1 var(--font-display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hint { color: var(--text-2); margin-top: 6px; font-size: 13px; }

  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
  .card-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: blink 1s ease-in-out infinite; }
  .lines { padding: 10px 18px 16px; }
  .line { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 5px 8px; margin: 0 -8px; border-radius: 7px; animation: rise .25s ease both; }
  .line:hover { background: var(--surface-2); }
  .line .at { font: 12px/22px var(--mono); color: var(--text-3); font-variant-numeric: tabular-nums; }
  .line .text { line-height: 22px; }
  #live .lines { padding-bottom: 0; }
  .partials { min-height: 43px; padding: 0 18px 16px 86px; }
  .partial { color: var(--text-3); font-style: italic; line-height: 22px; padding-top: 5px; }

  /* Who said it: the microphone's label in the page's red, the computer's sound in blue. */
  .voices { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--text-3); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .chip .icon { width: 12px; height: 12px; opacity: .65; }
  .chip input { width: 10ch; border: 0; padding: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; }
  .chip.mic, .who.mic { color: var(--mic); background: var(--mic-bg); }
  .chip.computer, .who.computer { color: var(--computer); background: var(--computer-bg); }
  .chip.mic:hover:not(:disabled) { background: var(--mic-bg); border-color: currentColor; }
  .chip.computer:hover:not(:disabled) { background: var(--computer-bg); border-color: currentColor; }
  .chip:focus-within { border-color: currentColor; }
  .who { display: inline-block; margin-right: 8px; padding: 0 7px; border-radius: 6px; font: 600 12px/20px var(--font); font-style: normal; vertical-align: 1px; }
  #transcript .who { cursor: pointer; }
  #transcript .who:hover { box-shadow: 0 0 0 1px currentColor inset; }
  .who input { width: 10ch; border: 0; padding: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; }
  .switch.small { padding: 4px 10px 4px 6px; font-size: 13px; }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }

  .detail { padding: 18px 20px 6px; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .title-input { flex: 1; min-width: 0; font: 600 21px/1.25 var(--font-display); letter-spacing: -0.015em; border: 1px solid transparent; background: transparent; padding: 3px 8px; margin-left: -9px; border-radius: 8px; cursor: text; }
  .title-input:hover { border-color: var(--border); background: var(--surface-2); }
  .title-input:focus { border-color: var(--accent); background: var(--surface-2); }
  .meta { color: var(--text-3); font-size: 12.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .detail .lines { padding: 8px 0 14px; }

  .empty { text-align: center; color: var(--text-2); padding: 56px 24px 40px; }
  .empty svg { width: 46px; height: 46px; opacity: .9; }
  .empty h3 { margin: 14px 0 4px; font: 600 17px/1.3 var(--font-display); color: var(--text); }
  .empty p { margin: 0 auto; max-width: 380px; font-size: 13.5px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 8px); display: inline-flex; align-items: center; gap: 8px; background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); box-shadow: var(--shadow); padding: 9px 14px; border-radius: 999px; max-width: 560px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; font-size: 13px; z-index: 30; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast .icon { color: var(--ok); }
  .toast.error .icon { color: var(--danger); }

  /* The tour: a spotlight that glides from one part of the window to the next, and a card. */
  .tour { position: fixed; inset: 0; z-index: 40; }
  .tour-veil { position: absolute; inset: 0; background: rgba(4, 5, 8, .64); transition: opacity .25s; }
  .tour.spotlit .tour-veil { opacity: 0; }
  .tour-spot { position: absolute; border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(4, 5, 8, .64), 0 0 0 1px rgba(255, 255, 255, .35); transition: top .35s cubic-bezier(.2, .8, .2, 1), left .35s cubic-bezier(.2, .8, .2, 1), width .35s cubic-bezier(.2, .8, .2, 1), height .35s cubic-bezier(.2, .8, .2, 1), opacity .25s; pointer-events: none; opacity: 0; }
  .tour.spotlit .tour-spot { opacity: 1; }
  .tour-card { position: absolute; width: 340px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: 0 24px 60px rgba(0, 0, 0, .45); padding: 16px 18px 14px; transition: top .35s cubic-bezier(.2, .8, .2, 1), left .35s cubic-bezier(.2, .8, .2, 1); }

  .tour-card h3 { margin: 8px 0 6px; font: 600 16px/1.3 var(--font-display); }
  .tour-card p { margin: 0; color: var(--text-2); font-size: 13.5px; line-height: 1.55; }
  .tour-bar { height: 2px; background: var(--surface-3); border-radius: 2px; margin: 14px 0 12px; overflow: hidden; }
  .tour-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .35s; }
  .tour-actions { display: flex; align-items: center; gap: 6px; }
  .tour-preview { outline: none; }

  /* The theme menu: a sample of each look, applied as soon as it is picked. */
  .themes { position: fixed; z-index: 35; width: 372px; padding: 14px 14px 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: 0 24px 60px rgba(0, 0, 0, .4); }
  .themes h2 { margin: 0 0 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .theme { gap: 10px; padding: 6px 10px 6px 6px; border-radius: 10px; font-size: 13px; text-align: left; color: var(--text-2); background: transparent; border-color: transparent; }
  .theme:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border); color: var(--text); }
  .theme[aria-pressed="true"] { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
  .swatch { position: relative; width: 38px; height: 26px; flex: none; border-radius: 7px; overflow: hidden; box-shadow: 0 0 0 1px rgba(128, 128, 128, .35) inset; }
  .swatch i { position: absolute; display: block; }

  /* Transcribe a file: a tile under the history, and the whole window as a drop target while a file is
     dragged over it. The one being transcribed shows its lines as they come, and waits in the history. */
  .import-tile { margin: 6px 14px 14px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 14px 11px 11px; border-radius: 12px; border: 1px dashed var(--border-strong); background: transparent; color: var(--text-2); }
  .import-tile:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .import-tile .badge, .import-head .badge { display: grid; place-items: center; flex: none; transition: background .12s, color .12s; }
  .import-tile .badge { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); }
  .import-tile:hover:not(:disabled) .badge { background: var(--accent-soft); color: var(--accent-text); }
  .import-tile b { display: block; font-weight: 600; font-size: 13.5px; color: var(--text); }
  .import-tile small { display: block; font-size: 12px; color: var(--text-3); }
  .dropzone { position: fixed; inset: 0; z-index: 45; padding: 16px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(16px) saturate(1.1); animation: fade .15s ease both; }
  .drop-frame { height: 100%; border-radius: 22px; border: 1.5px dashed color-mix(in srgb, var(--accent) 70%, transparent); display: grid; place-items: center; background: radial-gradient(55% 55% at 50% 46%, var(--accent-soft), transparent 72%); pointer-events: none; }
  .drop-card { text-align: center; max-width: 540px; padding: 0 20px; }
  .drop-icon { width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 24px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 6%, transparent); animation: float 1.8s ease-in-out infinite; }
  .drop-icon .icon { width: 32px; height: 32px; stroke-width: 1.6; }
  .drop-card h2 { margin: 0; font: 600 27px/1.2 var(--font-display); letter-spacing: -0.02em; }
  .drop-card p { margin: 8px 0 0; color: var(--text-2); font-size: 14px; }
  .drop-card .formats { margin-top: 18px; font: 11.5px/1 var(--mono); color: var(--text-3); letter-spacing: .02em; }
  .dropzone.busy .drop-frame { border-color: var(--border-strong); background: none; }
  .dropzone.busy .drop-icon { background: var(--rec-soft); color: var(--rec-text); box-shadow: none; animation: none; }
  .dropzone.busy .formats { display: none; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes float { 50% { transform: translateY(-4px); } }
  .importing { padding: 16px 18px 6px; }
  .import-head { display: flex; align-items: center; gap: 12px; }
  .import-head .badge { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent-text); }
  .import-head .name { flex: 1; min-width: 0; }
  .import-head .name b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .import-head .name span { display: block; color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .queue { font-size: 12px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .progress { height: 4px; border-radius: 999px; background: var(--surface-3); margin: 14px 0 2px; overflow: hidden; }
  .progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 50%, white), var(--accent)); background-size: 200% 100%; animation: sheen 1.6s linear infinite; transition: width .6s ease; }
  @keyframes sheen { to { background-position: -200% 0; } }
  .importing .lines { padding: 8px 0 12px; }
  .importing .lines:empty { padding: 0 0 12px; }
  .item.pending { border: 1px solid transparent; cursor: default; }
  .item.pending .meta { color: var(--accent-text); }
  .item.pending::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 3px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--done, 0%), var(--surface-3) 0); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 5px; background: var(--surface-3); color: var(--text-2); margin-right: 8px; line-height: 18px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  const $ = (id) => document.getElementById(id);
  const api = () => window.pywebview.api;
  const ui = { lang: "en", phase: "idle", model: "loading", recorderError: "", selected: null, title: "", startedAt: null, timer: null, count: 0, state: null,
               customLabels: {}, liveLabels: null, subtitling: new Set(), importing: null, dropReady: false };
  // The names the two audio sources have until the user gives them others (language.py says the same).
  const DEFAULT_LABELS = { en: { mic: "Me", computer: "Others" }, es: { mic: "Yo", computer: "Otros" } };
  const currentLabels = () => ({ ...DEFAULT_LABELS[ui.lang], ...ui.customLabels });
  // The looks, with the colors their samples show: background, a card on it, the accent.
  const THEMES = [
    ["system", "linear-gradient(135deg, #0b0c0f 50%, #f6f6f7 50%)", "transparent", "#ff5a4e"],
    ["dark", "#0b0c0f", "#1e1f25", "#ff5a4e"], ["light", "#f6f6f7", "#ffffff", "#f23b4c"],
    ["midnight", "#070b17", "#19223a", "#5b8cff"], ["ocean", "#051316", "#163238", "#2dd4bf"],
    ["forest", "#0a120d", "#1c2d22", "#4ade80"], ["grape", "#110c1a", "#281d3d", "#e879f9"],
    ["sunset", "#140d0a", "#2e201a", "#ff9a52"], ["paper", "#f4eee3", "#fbf8f1", "#c2410c"],
    ["contrast", "#000000", "#1c1c1c", "#ffd60a"],
  ];
  const t = (key) => STRINGS[ui.lang][key] ?? STRINGS.en[key] ?? key;
  // Python's messages are English; known ones, or known beginnings, are said in the page's language.
  const say = (message) => {
    const errors = STRINGS[ui.lang].errors || {};
    if (!message) return "";
    if (errors[message]) return errors[message];
    const pattern = (STRINGS[ui.lang].patterns || []).find(([english]) => english.test(message));
    if (pattern) return message.replace(pattern[0], pattern[1]);
    const start = Object.keys(errors).find((key) => key.endsWith(":") && message.startsWith(key));
    if (start) return errors[start] + message.slice(start.length);
    const sentence = Object.keys(errors).find((key) => message.startsWith(key));
    return sentence ? errors[sentence] + message.slice(sentence.length) : message;
  };

  const escapeHtml = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clock = (seconds) => {
    seconds = Math.max(0, Math.floor(seconds));
    const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
    const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };
  const megabytes = (bytes) => `${(bytes / 1e6).toFixed(bytes < 1e7 ? 1 : 0)} MB`;
  const when = (iso) => new Date(iso).toLocaleString(ui.lang, { dateStyle: "medium", timeStyle: "short" });
  const whoHtml = (source, names) => (names && names[source] ? `<span class="who ${source}" data-source="${source}">${escapeHtml(names[source])}</span>` : "");
  const lineHtml = (start, text, source = null, names = null) =>
    `<div class="line"><span class="at">${clock(start)}</span><span class="text">${whoHtml(source, names)}${escapeHtml(text)}</span></div>`;
  // A recording's labels, when two sources spoke in it: with one, there is nobody to tell apart.
  const namesOf = (record) => (new Set(record.segments.map((s) => s.source).filter(Boolean)).size > 1
    ? { ...DEFAULT_LABELS[ui.lang], ...(record.labels || {}) } : null);

  function toast(message, isError = false) {
    const el = $("toast");
    $("toastText").textContent = message;
    el.querySelector("use").setAttribute("href", isError ? "#i-alert" : "#i-check");
    el.classList.toggle("error", isError);
    el.classList.add("show");
    clearTimeout(el._hide);
    el._hide = setTimeout(() => el.classList.remove("show"), isError ? 6000 : 2600);
  }

  function applyLanguage() {
    document.documentElement.lang = ui.lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    $("langEn").setAttribute("aria-pressed", String(ui.lang === "en"));
    $("langEs").setAttribute("aria-pressed", String(ui.lang === "es"));
    if (ui.state) fillControls(ui.state);
    showChips();
    showThemes();
    render();
  }

  function render() {
    const busy = ui.phase !== "idle";
    const status = $("status");
    status.className = "pill";
    let text;
    if (ui.recorderError) text = t("cannotRecord");
    else if (ui.model === "loading") { text = t("loading"); status.classList.add("busy"); }
    else if (ui.model === "error") text = t("modelError");
    else if (ui.phase === "recording") { text = `${t("recording")} ${clock(Date.now() / 1000 - ui.startedAt)}`; status.classList.add("live"); }
    else if (ui.phase === "listening") { text = t("starting"); status.classList.add("live"); }
    else if (ui.phase === "finishing") { text = t("finishing"); status.classList.add("busy"); }
    else if (ui.importing) { text = t("transcribingPill")(Math.round(ui.importing.progress * 100)); status.classList.add("busy"); }
    else { text = t("ready"); status.classList.add("ready"); }
    $("statusText").textContent = text;

    const record = $("record");
    record.classList.toggle("active", ui.phase === "listening" || ui.phase === "recording");
    record.disabled = ui.phase === "finishing" || (!busy && (!!ui.importing || ui.model !== "ready" || !!ui.recorderError));
    $("importFile").disabled = busy || ui.model !== "ready";
    record.setAttribute("aria-label", busy ? t("stopRecording") : t("startRecording"));
    record.title = record.getAttribute("aria-label");
    $("mic").disabled = $("quality").disabled = $("systemAudio").disabled = $("subtitles").disabled = busy;
    const withComputer = !$("systemAudioOption").hidden && $("systemAudio").checked;
    document.querySelectorAll(".voices .chip").forEach((chip) => { chip.disabled = busy; });
    document.querySelector('.chip[data-source="computer"]').hidden = !withComputer;
    renderSubtitled();
    $("hint").textContent = {
      idle: ui.importing ? t("hintImporting") : withComputer ? t("hintIdleComputer") : t("hintIdle"),
      listening: t("hintStarting"), recording: t("hintRecording"), finishing: t("hintFinishing"),
    }[ui.phase];
    if (ui.phase === "recording") $("timer").textContent = clock(Date.now() / 1000 - ui.startedAt);
    else if (ui.phase === "idle") $("timer").textContent = "00:00";

    $("importing").hidden = !ui.importing || busy;
    if (!tour.preview) {
      $("live").hidden = !busy;
      $("detail").hidden = busy || !ui.selected;
      $("empty").hidden = busy || !!ui.selected || !!ui.importing;
    }
  }

  // --- a file being transcribed ------------------------------------------------------------------
  // What app_api sends: name, stage ("reading", "transcribing", "saving"), progress (0 to 1), done and
  // total (seconds of the file), eta (seconds left, once it can tell), waiting, and each chunk's lines.
  function importStatus(p) {
    if (p.stage === "reading") return t("reading")(p.total ? Math.round((p.done / p.total) * 100) : null);
    if (p.stage === "saving") return t("saving");
    return t("transcribingAt")(clock(p.done), clock(p.total), p.eta);
  }

  function showImport(p) {
    if (!ui.importing || ui.importing.name !== p.name) $("importLines").innerHTML = "";
    ui.importing = p;
    $("importName").textContent = p.name;
    $("importMeta").textContent = importStatus(p);
    $("importBar").style.width = `${(p.progress * 100).toFixed(1)}%`;
    $("importQueue").hidden = !p.waiting;
    $("importQueue").textContent = p.waiting ? t("waiting")(p.waiting) : "";
    if (p.lines) {
      const lines = $("importLines");
      lines.insertAdjacentHTML("beforeend", p.lines.map((l) => lineHtml(l.start, l.text)).join(""));
      while (lines.children.length > 6) lines.firstElementChild.remove();  // the latest lines; all of them come at the end
    }
    renderPendingItem();
    render();
  }

  function hideImport() {
    ui.importing = null;
    $("importLines").innerHTML = "";
    renderPendingItem();
    render();
  }

  // The file being transcribed, first in the history, with how far it got.
  function renderPendingItem() {
    let item = $("list").querySelector(".item.pending");
    if (!ui.importing || $("search").value.trim()) { if (item) item.remove(); return; }
    if (!item) {
      item = document.createElement("div");
      item.className = "item pending";
      item.innerHTML = `<div class="title"></div><div class="meta"></div>`;
      $("list").querySelector(".none")?.remove();
      $("list").prepend(item);
    }
    const percent = Math.round(ui.importing.progress * 100);
    item.querySelector(".title").textContent = ui.importing.name.replace(/\.[^.]+$/, "");
    item.querySelector(".meta").textContent = t("pendingMeta")(percent);
    item.style.setProperty("--done", `${percent}%`);
  }

  // Files dragged over the window: all of it takes them. Python gets their paths (app_api._on_drop);
  // the page only shows where to drop. While recording, the cursor says no and the drop does not happen.
  function listenForFiles() {
    const zone = $("dropzone");
    const carriesFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    let hide;
    const show = () => {
      const busy = ui.phase !== "idle";
      zone.classList.toggle("busy", busy);
      $("dropTitle").textContent = busy ? t("dropBusyTitle") : t("dropTitle");
      $("dropBody").textContent = busy ? t("dropBusyBody") : t("dropBody");
      zone.hidden = false;
      clearTimeout(hide);
      hide = setTimeout(() => { zone.hidden = true; }, 350);  // no dragover for a moment: the file went away
    };
    addEventListener("dragenter", (e) => { if (carriesFiles(e)) { e.preventDefault(); show(); } });
    addEventListener("dragover", (e) => {
      if (!carriesFiles(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = ui.phase === "idle" ? "copy" : "none";
      show();
    });
    addEventListener("drop", (e) => {
      e.preventDefault();
      clearTimeout(hide);
      zone.hidden = true;
      if (carriesFiles(e) && !ui.dropReady) toast(t("dropNotReady"), true);
    });
  }

  function setPhase(phase) {
    ui.phase = phase;
    clearInterval(ui.timer);
    if (phase === "recording") ui.timer = setInterval(render, 500);
    render();
  }

  function addPhrase(start, text, source) {
    $("phrases").insertAdjacentHTML("beforeend", lineHtml(start, text, source, ui.liveLabels));
    showPartial(source, "", "");
    $("phrases").lastElementChild.scrollIntoView({ block: "nearest" });
  }

  // The words still coming, one line per source that is talking.
  function showPartial(source, committed, pending) {
    let row = $("partials").querySelector(`[data-source="${source || "mic"}"]`);
    if (!committed && !pending) { if (row) row.remove(); return; }
    if (!row) {
      row = document.createElement("div");
      row.className = "partial";
      row.dataset.source = source || "mic";
      $("partials").appendChild(row);
    }
    row.innerHTML = `${whoHtml(source, ui.liveLabels)}${escapeHtml(committed)} <span style="opacity:.6">${escapeHtml(pending)}</span>`;
  }

  function showChips() {
    const labels = currentLabels();
    document.querySelectorAll(".voices .chip").forEach((chip) => {
      if (!chip.querySelector("input")) chip.querySelector(".name").textContent = labels[chip.dataset.source];
    });
  }

  function applyTheme(id) {
    ui.theme = THEMES.some(([known]) => known === id) ? id : "system";
    if (ui.theme === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = ui.theme;
    showThemes();
  }

  function showThemes() {
    $("themeGrid").innerHTML = THEMES.map(([id, bg, card, accent]) => `
      <button class="theme" data-theme-id="${id}" aria-pressed="${id === ui.theme}">
        <span class="swatch" style="background: ${bg}">
          <i style="left: 5px; top: 6px; width: 19px; height: 14px; border-radius: 3px; background: ${card}"></i>
          <i style="right: 5px; top: 9px; width: 8px; height: 8px; border-radius: 50%; background: ${accent}"></i>
        </span>${escapeHtml(t("themes")[id])}</button>`).join("");
  }

  function openThemes(open) {
    const menu = $("themes");
    menu.hidden = !open;
    $("themeButton").setAttribute("aria-expanded", String(open));
    if (!open) return;
    const button = $("themeButton").getBoundingClientRect();
    menu.style.top = `${button.bottom + 8}px`;
    menu.style.left = `${Math.max(14, Math.min(button.right - menu.offsetWidth, innerWidth - menu.offsetWidth - 14))}px`;
  }

  function renderSubtitled() {
    const busy = ui.subtitling.has(ui.selected);
    $("subtitled").disabled = busy;
    $("subtitledText").textContent = busy ? t("subtitling") : t("subtitled");
  }

  // A label turned into a text box in place: Enter or leaving it saves, Esc puts the old name back.
  function editInPlace(holder, value, save) {
    if (holder.querySelector("input")) return;
    const name = holder.querySelector(".name") || holder;
    const input = document.createElement("input");
    input.value = value;
    input.maxLength = 40;
    name.replaceChildren(input);
    input.focus();
    input.select();
    let done = false;
    const finish = (keep) => {
      if (done) return;
      done = true;
      save(keep ? input.value.trim() : null);
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") finish(true);
      if (e.key === "Escape") finish(false);
    });
    input.addEventListener("click", (e) => e.stopPropagation());
    input.addEventListener("blur", () => finish(true));
  }

  window.cronista = {
    onEvent(kind, payload) {
      const handlers = {
        model: (p) => { ui.model = p.state; if (p.state === "error") showBanner(say(p.message)); render(); },
        listening: () => setPhase("listening"),
        recording: (p) => { ui.startedAt = p.started_at; setPhase("recording"); },
        partial: (p) => showPartial(p.source, p.committed, p.pending),
        phrase: (p) => addPhrase(p.start, p.text, p.source),
        finalizing: () => setPhase("finishing"),
        saved: async (p) => { setPhase("idle"); await refreshList(); await select(p.id); toast(t("saved")); },
        notice: (p) => toast(say(p.message)),
        subtitling: (p) => { ui.subtitling.add(p.id); renderSubtitled(); },
        subtitled: (p) => {
          ui.subtitling.delete(p.id);
          renderSubtitled();
          toast(t(ui.record && ui.record.id === p.id && ui.record.kind === "video" ? "subtitledSavedFile" : "subtitledSaved"));
        },
        "drop-ready": () => { ui.dropReady = true; },
        import: (p) => showImport(p),
        imported: async (p) => { hideImport(); await refreshList(); await select(p.id); toast(t("transcribed")); },
        "import-cancelled": () => { hideImport(); toast(t("importCancelled")); },
        "import-error": (p) => { hideImport(); toast(`${p.name}: ${say(p.message)}`, true); },
        "import-refused": (p) => toast(say(p.message), true),
        error: (p) => {
          toast(say(p.message), true);
          if (p.id) { ui.subtitling.delete(p.id); renderSubtitled(); } else setPhase("idle");  // a subtitled copy's error stops nothing else
        },
      };
      (handlers[kind] || (() => {}))(payload);
    },
  };

  function showBanner(message) {
    $("banner").textContent = message;
    $("banner").hidden = !message;
  }

  async function refreshList() {
    const query = $("search").value.trim();
    const items = await api().recordings(query);
    const list = $("list");
    list.innerHTML = "";
    if (!query) ui.count = items.length;
    $("count").textContent = query ? t("found")(items.length) : ui.count ? t("count")(ui.count) : "";
    if (!items.length) {
      list.innerHTML = `<div class="none">${query ? t("nothingMatches") : t("noRecordings")}</div>`;
      renderPendingItem();
      return;
    }
    for (const item of items) {
      const button = document.createElement("button");
      button.className = "item" + (item.id === ui.selected ? " selected" : "");
      const snippet = escapeHtml(item.snippet || "").replace(/\[/g, "<mark>").replace(/\]/g, "</mark>");
      button.innerHTML = `<div class="title">${escapeHtml(item.title)}</div>
        <div class="meta">${when(item.created_at)} · ${clock(item.duration_seconds)} · ${megabytes(item.size_bytes)}</div>
        <div class="snippet">${snippet || t("noSpeech")}</div>`;
      button.onclick = () => select(item.id);
      button.ondblclick = () => startRenaming(item.id);
      list.appendChild(button);
    }
    renderPendingItem();
  }

  async function select(id) {
    const record = await api().recording(id);
    if (!record) return;
    ui.selected = id;
    ui.title = record.title;
    ui.record = record;
    showRecord(record);
    await refreshList();
    render();
  }

  // A dropped file's transcript: a tag says audio or video, Show in folder shows the file itself, and only
  // a video gets a subtitled copy.
  const fromFile = (record) => !!record && !!record.kind && record.kind !== "recording";

  function showRecord(record) {
    $("title").value = record.title;
    const about = escapeHtml(`${when(record.created_at)} · ${clock(record.duration_seconds)} · ${megabytes(record.size_bytes)}`);
    $("meta").innerHTML = fromFile(record)
      ? `<span class="tag">${t(record.kind === "video" ? "kindVideo" : "kindAudio")}</span>${t("imported")} · ${about}` : about;
    $("subtitled").hidden = record.kind === "audio";
    $("reveal").title = t(fromFile(record) ? "revealFileTitle" : "revealTitle");
    const names = namesOf(record);
    $("transcript").innerHTML = record.segments.length
      ? record.segments.map((s) => lineHtml(s.start, s.text, s.source, names)).join("")
      : `<p class="hint">${t("noSpeechHere")}</p>`;
    renderSubtitled();
  }

  async function startRenaming(id) {
    if (id !== ui.selected) await select(id);
    const title = $("title");
    title.focus();
    title.select();
  }

  async function act(call, okMessage) {
    const result = await call();
    if (result && result.error) toast(say(result.error), true);
    else if (okMessage) toast(okMessage);
    return result;
  }

  function fillControls(state) {
    const mic = $("mic");
    const chosen = mic.value || state.settings.microphone;
    mic.innerHTML = state.microphones.length
      ? state.microphones.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.name)}</option>`).join("")
      : `<option value="">${t("noMic")}</option>`;
    if (chosen) mic.value = chosen;
    const quality = $("quality");
    const level = quality.value || state.settings.quality;
    quality.innerHTML = state.qualities.map((q) => `<option value="${q}">${t("qualities")[q] || q}</option>`).join("");
    quality.value = level;
  }

  async function setLanguage(lang) {
    if (lang === ui.lang) return;
    ui.lang = lang;
    applyLanguage();
    await refreshList();
    if (ui.record && !tour.preview) showRecord(ui.record);
    if (tour.open) tour.show(tour.index);
    if (ui.phase === "idle") ui.liveLabels = null;
    api().save_preferences(lang, null);
  }

  // --- the tour ------------------------------------------------------------------------------
  const tour = {
    open: false, index: 0, preview: null,
    start() {
      this.open = true;
      $("tour").hidden = false;
      this.show(0);
      $("tourNext").focus();
    },
    finish() {
      this.open = false;
      this.unpreview();
      $("tour").hidden = true;
      api().save_preferences(null, true);
    },
    steps() { return STRINGS[ui.lang].tour; },
    show(index) {
      const steps = this.steps();
      this.index = Math.max(0, Math.min(index, steps.length - 1));
      const step = steps[this.index];
      if (step.preview !== this.preview) { this.unpreview(); this.doPreview(step.preview); }
      $("tourCount").textContent = `${this.index + 1} ${t("of")} ${steps.length}`;
      $("tourTitle").textContent = step.title;
      $("tourBody").textContent = step.body;
      $("tourBar").style.width = `${((this.index + 1) / steps.length) * 100}%`;
      $("tourBack").textContent = t("back");
      $("tourBack").hidden = this.index === 0;
      $("tourNext").textContent = this.index === steps.length - 1 ? t("done") : t("next");
      $("tourSkip").textContent = t("skip");
      $("tourSkip").hidden = this.index === steps.length - 1;
      requestAnimationFrame(() => this.place(step));
    },
    // Some parts only show while recording, or with a recording open: the tour shows them with an example.
    doPreview(kind) {
      this.preview = kind || null;
      if (!kind) return;
      const sample = STRINGS[ui.lang].sample;
      if (kind === "live" && ui.phase === "idle") {
        const sources = STRINGS[ui.lang].sampleSources;
        $("phrases").innerHTML = sample.map((text, i) => lineHtml(i * 4, text, sources[i], currentLabels())).join("");
        $("partials").innerHTML = "";
        $("live").hidden = false;
        $("detail").hidden = true;
        $("empty").hidden = true;
      } else if (kind === "detail" && !ui.selected && ui.phase === "idle") {
        $("title").value = STRINGS[ui.lang].sampleTitle;
        $("meta").textContent = `${when(new Date().toISOString())} · 12:34 · 48 MB`;
        $("transcript").innerHTML = sample.map((text, i) => lineHtml(i * 4, text, STRINGS[ui.lang].sampleSources[i], currentLabels())).join("");
        $("subtitled").hidden = false;
        $("detail").hidden = false;
        $("live").hidden = true;
        $("empty").hidden = true;
      } else {
        this.preview = null;
      }
    },
    unpreview() {
      if (!this.preview) return;
      this.preview = null;
      if (ui.phase === "idle") $("phrases").innerHTML = "";
      if (ui.record) showRecord(ui.record);
      render();
    },
    place(step) {
      const spot = $("tourSpot"), card = $("tourCard"), root = $("tour");
      const target = step.target && document.querySelector(`[data-tour="${step.target}"]`);
      const box = target && !target.closest("[hidden]") ? target.getBoundingClientRect() : null;
      const margin = 14, width = innerWidth, height = innerHeight, cardBox = card.getBoundingClientRect();
      if (!box || box.width === 0) {
        root.classList.remove("spotlit");
        card.style.left = `${(width - cardBox.width) / 2}px`;
        card.style.top = `${(height - cardBox.height) / 2}px`;
        return;
      }
      root.classList.add("spotlit");
      const pad = 6;
      spot.style.left = `${box.left - pad}px`;
      spot.style.top = `${box.top - pad}px`;
      spot.style.width = `${box.width + pad * 2}px`;
      spot.style.height = `${box.height + pad * 2}px`;
      // Beside the part if there is room, otherwise below or above it.
      let left, top;
      if (box.right + margin + cardBox.width < width - margin) { left = box.right + margin + pad; top = box.top; }
      else if (box.bottom + margin + cardBox.height < height - margin) { left = box.left; top = box.bottom + margin + pad; }
      else { left = box.left; top = box.top - cardBox.height - margin - pad; }
      card.style.left = `${Math.max(margin, Math.min(left, width - cardBox.width - margin))}px`;
      card.style.top = `${Math.max(margin, Math.min(top, height - cardBox.height - margin))}px`;
    },
  };

  async function init() {
    const state = await api().state();
    ui.state = state;
    ui.lang = state.settings.language || ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
    ui.model = state.model.state;
    ui.phase = state.phase;
    ui.recorderError = state.recorder_error;
    $("systemAudioOption").hidden = !state.system_audio_supported;
    $("systemAudio").checked = state.settings.system_audio;
    $("subtitles").checked = !!state.settings.subtitles;
    ui.customLabels = { ...(state.settings.labels || {}) };
    applyTheme(state.settings.theme || "system");
    applyLanguage();
    if (state.recorder_error) showBanner(say(state.recorder_error));
    else if (state.model.state === "error") showBanner(say(state.model.message));

    $("systemAudio").onchange = render;
    $("subtitles").onchange = () => api().save_preferences(null, null, null, $("subtitles").checked);
    $("themeButton").onclick = (e) => { e.stopPropagation(); openThemes($("themes").hidden); };
    $("themeGrid").addEventListener("click", (e) => {
      const choice = e.target.closest("[data-theme-id]");
      if (!choice) return;
      applyTheme(choice.dataset.themeId);
      api().save_preferences(null, null, null, null, ui.theme);
    });
    $("themes").addEventListener("click", (e) => e.stopPropagation());
    document.addEventListener("click", () => openThemes(false));  // a click anywhere else closes the menu
    addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("themes").hidden) openThemes(false); });
    addEventListener("resize", () => { if (!$("themes").hidden) openThemes(true); });
    document.querySelectorAll(".voices .chip").forEach((chip) => {
      chip.onclick = () => editInPlace(chip, currentLabels()[chip.dataset.source], (value) => {
        if (value !== null) {
          if (value) ui.customLabels[chip.dataset.source] = value;
          else delete ui.customLabels[chip.dataset.source];  // empty: back to the default name
          api().save_preferences(null, null, ui.customLabels);
        }
        chip.querySelector(".name").textContent = currentLabels()[chip.dataset.source];
      });
    });
    $("transcript").addEventListener("click", (e) => {
      const who = e.target.closest(".who");
      if (!who || !ui.selected || tour.preview || !ui.record) return;
      const source = who.dataset.source;
      editInPlace(who, namesOf(ui.record)[source], async (value) => {
        if (value && value !== namesOf(ui.record)[source]) {
          const result = await act(() => api().rename_label(ui.selected, source, value), t("labelRenamed"));
          if (result && result.ok) ui.record.labels = result.labels;
        }
        showRecord(ui.record);
      });
    });
    $("langEn").onclick = () => setLanguage("en");
    $("langEs").onclick = () => setLanguage("es");
    $("help").onclick = () => tour.start();
    $("tourNext").onclick = () => (tour.index === tour.steps().length - 1 ? tour.finish() : tour.show(tour.index + 1));
    $("tourBack").onclick = () => tour.show(tour.index - 1);
    $("tourSkip").onclick = () => tour.finish();
    addEventListener("resize", () => tour.open && tour.place(tour.steps()[tour.index]));
    addEventListener("keydown", (e) => {
      if (!tour.open) return;
      if (e.key === "Escape") tour.finish();
      else if (e.key === "ArrowRight") $("tourNext").click();
      else if (e.key === "ArrowLeft" && tour.index > 0) tour.show(tour.index - 1);
    });

    $("record").onclick = async () => {
      if (ui.phase === "idle") {
        $("phrases").innerHTML = "";
        $("partials").innerHTML = "";
        const systemAudio = state.system_audio_supported && $("systemAudio").checked;
        ui.liveLabels = systemAudio ? currentLabels() : null;  // with the microphone alone there is nobody to tell apart
        const result = await act(() => api().start($("mic").value, $("quality").value, systemAudio, ui.lang,
                                                    currentLabels(), $("subtitles").checked));
        if (result && result.ok) setPhase("listening");
      } else {
        await api().stop();
        setPhase("finishing");
      }
    };
    $("openFolder").onclick = () => act(() => api().open_recordings_folder());
    $("play").onclick = () => act(() => api().play(ui.selected));
    $("reveal").onclick = () => act(() => api().reveal(ui.selected));
    $("copy").onclick = async () => {
      const result = await act(() => api().copy_text(ui.selected));
      if (result && result.text !== undefined) await navigator.clipboard.writeText(result.text);
      if (result && !result.error) toast(t("copied"));
    };
    $("word").onclick = () => act(() => api().export_word(ui.selected, ui.lang), t(fromFile(ui.record) ? "wordSavedFile" : "wordSaved"));
    $("pdf").onclick = () => act(() => api().export_pdf(ui.selected, ui.lang), t(fromFile(ui.record) ? "pdfSavedFile" : "pdfSaved"));
    $("subtitled").onclick = async () => {
      const id = ui.selected;
      const result = await act(() => api().subtitled_video(id, ui.lang));
      if (result && result.ok) { ui.subtitling.add(id); renderSubtitled(); }
    };
    $("delete").onclick = async () => {
      const file = fromFile(ui.record);  // its transcript goes; the file itself stays where it is
      if (!confirm(t(file ? "confirmDeleteFile" : "confirmDelete"))) return;
      await act(() => api().delete(ui.selected), t(file ? "deletedFile" : "deleted"));
      ui.selected = null;
      ui.record = null;
      await refreshList();
      render();
    };
    const rename = async () => {
      const title = $("title").value.trim();
      if (!ui.selected || tour.preview) return;
      if (!title) { $("title").value = ui.title; return; }  // an empty title puts the old one back
      if (title === ui.title) return;
      const result = await act(() => api().rename(ui.selected, title), t("renamed"));
      if (result && result.ok) { ui.title = title; if (ui.record) ui.record.title = title; }
      await refreshList();
    };
    $("title").addEventListener("change", rename);
    $("title").addEventListener("keydown", (e) => {
      if (e.key === "Enter") e.target.blur();
      if (e.key === "Escape") { e.target.value = ui.title; e.target.blur(); }  // back to the saved title
    });
    $("rename").onclick = () => startRenaming(ui.selected);
    let searchTimer;
    $("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(refreshList, 220); });
    $("importFile").onclick = () => act(() => api().pick_files(ui.lang));
    $("importCancel").onclick = () => act(() => api().cancel_import());
    listenForFiles();

    await refreshList();
    if (state.importing) showImport(state.importing);
    render();
    if (!state.settings.tour_seen) setTimeout(() => tour.start(), 450);
  }

  window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
